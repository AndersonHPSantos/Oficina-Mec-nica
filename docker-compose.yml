
services:
  mongo:
    image: mongo:8
    container_name: oficina-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: .
    container_name: oficina-api
    environment:
      APP_NAME: "Oficina API"
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: oficina_db
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./app:/code/app

volumes:
  mongo_data:
